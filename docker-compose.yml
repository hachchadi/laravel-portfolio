version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-portfolio-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel-portfolio

  webserver:
    image: nginx:alpine
    container_name: laravel-portfolio-webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./docker/nginx/ssl/:/etc/nginx/ssl/
    networks:
      - laravel-portfolio

  database:
    image: mysql:8.0
    container_name: laravel-portfolio-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_portfolio
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - laravel-portfolio

  redis:
    image: redis:alpine
    container_name: laravel-portfolio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - laravel-portfolio

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-portfolio-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - database
      - redis
    networks:
      - laravel-portfolio

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-portfolio-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - database
      - redis
    networks:
      - laravel-portfolio

networks:
  laravel-portfolio:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local